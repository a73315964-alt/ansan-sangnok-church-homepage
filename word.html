<section class="word-hero">
  <div class="word-hero-bg" id="wordHeroBg" style="background-image:url('https://files.ansansangrok.or.kr/photos/church/church-exterior-main.jpg')"></div>
  <div class="word-hero-overlay"></div>
  <div class="wrap word-hero-content" id="wordHeroContent">
    <span class="eyebrow">THE WORD</span>
    <h1>성경속으로</h1>
    <p>신앙의 뿌리, 말씀. 매일의 묵상과 주일의 설교가 차곡차곡 쌓이는 안산상록교회의 말씀 공간입니다.</p>
  </div>
</section>

<section id="thisweek">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">Sermon</span>
      <h2>이번 주 설교</h2>
      <p>영상으로 다시 보고, 설교문으로 다시 읽으세요.</p>
    </div>
    <div class="card sermon-feature" id="sermonFeature"></div>
    <div class="sermon-nav">
      <button type="button" id="sermonPrev">← 지난 주 설교</button>

    </div>
  </div>
</section>

<section class="bg-soft">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">Daily & Dawn</span>
      <h2>매일 성경읽기 · 새벽기도 묵상</h2>
      <p>온 교회가 함께 걷는 매일의 말씀입니다.</p>
    </div>
    <div class="grid grid-2">
      <div class="card devotion-card" id="dailyReadingWrap">
        <h3 style="margin-bottom:2px;font-size:1rem;color:var(--muted);font-weight:700;">DAILY QT · 매일 성경읽기</h3>
        <div id="dailyReadingCard"></div>
        <button type="button" class="history-toggle" data-history-toggle="dailyReadingHistory">지난 묵상 보기</button>

      </div>
      <div class="card devotion-card" id="dawnPrayerWrap">

        <div id="dawnPrayerCard"></div>
        <button type="button" class="history-toggle" data-history-toggle="dawnPrayerHistory">지난 묵상 보기</button>
        <div class="devotion-history" id="dawnPrayerHistory"></div>
      </div>
    </div>
  </div>
</section>

  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">Archive</span>
      <h2>지난 말씀 아카이브</h2>

    <div style="text-align:center;margin-top:26px;">
