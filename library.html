<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도서관 — 안산상록교회</title>
<meta name="description" content="안산상록교회 도서관 — 신앙 도서와 교육 자료를 찾아보세요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='0,0 58,0 46,50 58,100 0,100' fill='%2329b6f6'/%3E%3Cpolygon points='100,0 58,0 46,50 58,100 100,100' fill='%238bc34a'/%3E%3Crect x='43' y='12' width='14' height='76' fill='white'/%3E%3Crect x='22' y='43' width='56' height='14' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="canonical" href="https://ansansangrok.or.kr/library.html">
</head>
<body data-page="library">

<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="wrap">
    <div class="crumb">홈 / 도서관</div>
    <h1>도서관</h1>
    <p>신앙 도서와 교육 자료를 찾아보고 내려받으실 수 있습니다.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <input type="search" id="librarySearch" placeholder="제목·저자로 검색"
      style="width:100%;max-width:420px;display:block;margin:0 auto 30px;padding:12px 16px;border-radius:10px;border:1px solid var(--border);font-family:inherit;font-size:.92rem;">
    <div id="libraryList" style="max-width:820px;margin:0 auto;display:grid;gap:16px;"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script src="js/library.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function render(list) {
    var host = document.getElementById("libraryList");
    if (!list.length) {
      host.innerHTML = '<div class="empty-state">등록된 자료가 없습니다.</div>';
      return;
    }
    host.innerHTML = list.map(function (item) {
      var linkHtml = item.url
        ? '<a class="btn btn-outline" target="_blank" rel="noopener" href="' + esc(item.url) + '">내려받기</a>'
        : '<span class="btn btn-outline" style="opacity:.5;pointer-events:none;">준비 중</span>';
      return (
        '<div class="card library-item">' +
        "<div><span class=\"cat\">" + esc(item.category || "자료") + "</span>" +
        "<h4>" + esc(item.title) + "</h4>" +
        "<p>" + esc(item.author ? item.author + " · " : "") + esc(item.desc || "") + "</p></div>" +
        linkHtml +
        "</div>"
      );
    }).join("");
  }

  document.addEventListener("DOMContentLoaded", function () {
    var all = window.LIBRARY || [];
    render(all);
    var search = document.getElementById("librarySearch");
    search.addEventListener("input", function () {
      var q = search.value.trim().toLowerCase();
      if (!q) { render(all); return; }
      render(all.filter(function (item) {
        return [item.title, item.author, item.desc].some(function (v) {
          return v && v.toLowerCase().indexOf(q) !== -1;
        });
      }));
    });
  });
})();
</script>
</body>
</html>
