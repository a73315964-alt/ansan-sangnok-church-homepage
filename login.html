<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — 안산상록교회</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-13 7 104 104'%3E%3Cpolygon points='2,7 42,14 42,88 2,94' fill='%233cafff'/%3E%3Cpolygon points='35,19 75,10 75,111 35,101' fill='%2392d700'/%3E%3Crect x='35.5' y='19' width='7' height='68.5' fill='white'/%3E%3Crect x='16.5' y='39.5' width='44' height='6' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--paper-soft); }
  .login-card{ width:100%; max-width:380px; margin:24px; }
  .login-card h1{ font-size:1.3rem; text-align:center; margin-bottom:6px; }
  .login-card p.sub{ text-align:center; margin-bottom:22px; font-size:.88rem; }
  .tabs{ display:flex; gap:6px; background:var(--paper-soft); border-radius:12px; padding:4px; margin-bottom:20px; }
  .tabs button{
    flex:1; padding:9px 0; border:0; border-radius:9px; background:transparent; font-family:inherit;
    font-size:.9rem; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .tabs button.on{ background:#fff; color:var(--accent); box-shadow:0 1px 4px rgba(31,39,36,.08); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.85rem; font-weight:700; margin-bottom:6px; color:var(--ink); }
  .field input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    font-size:.95rem; font-family:inherit;
  }
  .field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .field .hint{ font-size:.78rem; color:var(--muted); margin-top:5px; }
  .login-card .btn{ width:100%; justify-content:center; margin-top:6px; }
  .msg{ font-size:.85rem; text-align:center; margin-top:14px; line-height:1.6; }
  .msg.error{ color:#b3261e; }
  .msg.info{ color:var(--muted); }
  .msg.ok{ color:#2e7d32; }
  .text-link{ display:block; text-align:center; margin-top:14px; font-size:.84rem; color:var(--muted); background:none; border:0; cursor:pointer; font-family:inherit; width:100%; }
  .text-link:hover{ color:var(--accent); }
  .back-link{ display:block; text-align:center; margin-top:18px; font-size:.85rem; color:var(--muted); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>

<div class="card login-card">
  <h1 id="title">로그인</h1>
  <p class="sub" id="sub">생년월일만 입력하면 로그인됩니다. 1년 성경읽기 등 성도 전용 기능을 이용하실 수 있습니다.</p>

  <div class="tabs" id="tabs">
    <button type="button" data-mode="login" class="on">로그인</button>
    <button type="button" data-mode="signup">회원가입</button>
  </div>

  <!-- 로그인 (일반 회원 — 생년월일만) -->
  <form id="loginForm">
    <div class="field">
      <label for="birth">생년월일</label>
      <input id="birth" inputmode="numeric" autocomplete="bday" required maxlength="10" placeholder="예: 19650312">
      <div class="hint">숫자 8자리로 입력하세요 (년 4자리 · 월 2자리 · 일 2자리)</div>
    </div>
    <button type="submit" class="btn btn-primary">로그인</button>
    <button type="button" class="text-link" data-goto="admin">관리자 로그인 (이메일)</button>
  </form>

  <!-- 관리자 로그인 (이메일 + 비밀번호) -->
  <form id="adminForm" hidden>
    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">관리자 로그인</button>
    <button type="button" class="text-link" data-goto="forgot">비밀번호를 잊으셨나요?</button>
    <button type="button" class="text-link" data-goto="login">← 생년월일 로그인으로</button>
  </form>

  <!-- 회원가입 -->
  <form id="signupForm" hidden>
    <div class="field">
      <label for="su_name">성명</label>
      <input id="su_name" autocomplete="name" required maxlength="30" placeholder="예: 홍길동">
    </div>
    <div class="field">
      <label for="su_birth">생년월일</label>
      <input type="date" id="su_birth" autocomplete="bday" required>
      <div class="hint">교적부의 성명·생년월일과 일치하면 바로 <b>정회원</b>으로 인증됩니다. 교적에 없으면 관리자 확인 후 등록됩니다.</div>
    </div>
    <button type="submit" class="btn btn-primary">가입 신청</button>
  </form>

  <!-- 비밀번호 찾기 -->
  <form id="forgotForm" hidden>
    <div class="field">
      <label for="fg_email">가입한 이메일</label>
      <input type="email" id="fg_email" autocomplete="email" required>
    </div>
    <button type="submit" class="btn btn-primary">재설정 메일 받기</button>
    <button type="button" class="text-link" data-goto="admin">← 관리자 로그인으로</button>
  </form>

  <!-- 새 비밀번호 (재설정 메일의 링크로 들어온 경우) -->
  <form id="resetForm" hidden>
    <div class="field">
      <label for="rs_password">새 비밀번호</label>
      <input type="password" id="rs_password" autocomplete="new-password" required minlength="8">
      <div class="hint">8자 이상</div>
    </div>
    <button type="submit" class="btn btn-primary">비밀번호 변경</button>
  </form>

  <div class="msg" id="msg"></div>
  <a href="index.html" class="back-link">← 홈으로</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  var msg = document.getElementById("msg");
  var params = new URLSearchParams(location.search);
  // 로그인 후 돌아갈 화면 — 같은 사이트의 .html 파일만 허용
  var next = params.get("next") || "";
  if (!/^[\w-]+\.html$/.test(next)) next = "dashboard.html";

  var FORMS = { login: "loginForm", admin: "adminForm", signup: "signupForm", forgot: "forgotForm", reset: "resetForm" };
  var TITLES = {
    login: ["로그인", "생년월일만 입력하면 로그인됩니다. 1년 성경읽기 등 성도 전용 기능을 이용하실 수 있습니다."],
    admin: ["관리자 로그인", "관리자는 이메일과 비밀번호로 로그인합니다."],
    signup: ["회원가입", "교적에 등록된 교인은 성명·생년월일로 바로 정회원 인증됩니다."],
    forgot: ["관리자 비밀번호 찾기", "관리자 이메일로 비밀번호 재설정 링크를 보내드립니다."],
    reset: ["새 비밀번호 설정", "사용하실 새 비밀번호를 입력해주세요."],
  };

  function show(text, kind) {
    msg.textContent = text || "";
    msg.className = "msg " + (kind || "info");
  }

  function setMode(mode) {
    Object.keys(FORMS).forEach(function (m) {
      document.getElementById(FORMS[m]).hidden = m !== mode;
    });
    document.getElementById("tabs").hidden = !(mode === "login" || mode === "signup");
    document.querySelectorAll("#tabs button").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-mode") === mode);
    });
    document.getElementById("title").textContent = TITLES[mode][0];
    document.getElementById("sub").textContent = TITLES[mode][1];
    show("");
  }

  function errorText(err) {
    var m = (err && err.message) || "";
    if (m === "BIRTH_NOT_FOUND") return "이 생년월일로 가입된 회원을 찾지 못했습니다. 아직 가입하지 않으셨다면 회원가입을 해주세요. (문의: 교회 사무실)";
    if (/Invalid login credentials/i.test(m)) return "이메일 또는 비밀번호가 맞지 않습니다.";
    if (/Email not confirmed/i.test(m)) return "이메일 확인이 아직 안 되었습니다. 받은 메일의 확인 링크를 눌러주세요.";
    if (/already registered|already exists/i.test(m)) return "이미 가입된 이메일입니다. 로그인해 주세요.";
    if (/banned/i.test(m)) return "이용이 정지된 계정입니다. 교회 사무실에 문의해 주세요.";
    if (/Signups not allowed/i.test(m)) return "현재 회원가입이 닫혀 있습니다. 교회 사무실에 문의해 주세요.";
    if (/Password should be/i.test(m)) return "비밀번호가 너무 짧거나 쉽습니다. 8자 이상으로 정해주세요.";
    if (/rate limit/i.test(m)) return "요청이 많아 잠시 막혔습니다. 몇 분 뒤 다시 시도해 주세요.";
    return m || "잠시 후 다시 시도해 주세요.";
  }

  async function busy(form, fn) {
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    try { await fn(); } catch (err) { show(errorText(err), "error"); }
    btn.disabled = false;
  }

  document.getElementById("tabs").addEventListener("click", function (e) {
    var m = e.target.getAttribute("data-mode");
    if (m) setMode(m);
  });
  document.querySelectorAll("[data-goto]").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.getAttribute("data-goto")); });
  });

  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var form = this;
    var birth = normalizeBirth(document.getElementById("birth").value);
    if (!birth) {
      show("생년월일을 숫자 8자리로 입력해주세요. 예: 19650312", "error");
      return;
    }
    busy(form, async function () {
      show("로그인 중…");
      try {
        await sbBirthLogin(birth);
      } catch (err) {
        // 생년월일 비밀번호가 아직 적용되지 않은 계정 등
        if (/Invalid login credentials/i.test((err && err.message) || "")) {
          throw new Error("생년월일로 로그인하지 못했습니다. 교회 사무실에 문의해 주세요.");
        }
        throw err;
      }
      location.href = next;
    });
  });

  document.getElementById("adminForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var form = this;
    busy(form, async function () {
      show("로그인 중…");
      await sbLogin(document.getElementById("email").value.trim(), document.getElementById("password").value);
      location.href = next;
    });
  });

  document.getElementById("signupForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var form = this;
    busy(form, async function () {
      show("가입 신청 중…");
      var data = await sbSignup(
        document.getElementById("su_name").value.trim(),
        document.getElementById("su_birth").value
      );
      if (data.session) {
        location.href = next; // 가입 즉시 로그인됨
        return;
      }
      form.reset();
      show("가입 신청이 접수되었습니다. 생년월일로 로그인해 주세요. (목사님 승인 후 성경읽기 기록이 가능합니다)", "ok");
    });
  });

  document.getElementById("forgotForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var form = this;
    busy(form, async function () {
      await sbSendPasswordReset(document.getElementById("fg_email").value.trim());
      show("재설정 메일을 보냈습니다. 메일의 링크를 눌러 새 비밀번호를 정해주세요.", "ok");
    });
  });

  document.getElementById("resetForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var form = this;
    busy(form, async function () {
      await sbUpdatePassword(document.getElementById("rs_password").value);
      show("비밀번호가 변경되었습니다. 잠시 후 이동합니다…", "ok");
      setTimeout(function () { location.href = next; }, 1200);
    });
  });

  (async function init() {
    if (!window.SB_READY) {
      show("Supabase 연결이 설정되지 않았습니다. js/config.js 의 SUPABASE_URL / SUPABASE_ANON_KEY 를 채워주세요.", "error");
      return;
    }
    // 상단 메뉴의 "로그아웃" → 여기서 로그아웃하고 홈으로
    if (params.get("logout") === "1") {
      show("로그아웃 중…");
      try { await window.SB.auth.signOut(); } catch (e) {}
      // 네트워크 오류로 서버 로그아웃이 실패해도 이 브라우저에서는 확실히 지움
      try {
        Object.keys(localStorage).forEach(function (k) { if (/^sb-.*-auth-token/.test(k)) localStorage.removeItem(k); });
      } catch (e) {}
      location.replace("index.html");
      return;
    }
    if (params.get("mode") === "reset") { setMode("reset"); return; }
    if (params.get("mode") === "signup") setMode("signup");
    // 이미 로그인되어 있으면(이메일 확인 링크로 들어온 경우 포함) 바로 이동
    if (await sbCurrentSession()) location.href = next;
  })();
</script>
</body>
</html>
