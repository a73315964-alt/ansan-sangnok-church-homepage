<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 1년 성경읽기 — 안산상록교회</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-13 7 104 104'%3E%3Cpolygon points='2,7 42,14 42,88 2,94' fill='%233cafff'/%3E%3Cpolygon points='35,19 75,10 75,111 35,101' fill='%2392d700'/%3E%3Crect x='35.5' y='19' width='7' height='68.5' fill='white'/%3E%3Crect x='16.5' y='39.5' width='44' height='6' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bible.css">
</head>
<body>

<div class="admin-bar">
  <div class="wrap">
    <div>
      <h1>나의 1년 성경읽기</h1>
      <div class="who" id="whoLine">확인 중…</div>
    </div>
    <div class="bar-actions">
      <a href="admin.html" class="btn btn-primary" id="adminLink" hidden>관리자 대시보드</a>
      <a href="mypage.html" class="btn btn-outline">내 정보</a>
      <a href="index.html" class="btn btn-outline">홈으로</a>
      <button class="btn btn-outline" id="logoutBtn">로그아웃</button>
    </div>
  </div>
</div>

<div class="br-wrap">
  <div id="notice"></div>

  <div id="main" hidden>
    <div class="tiles">
      <div class="tile">
        <div class="label">전체 진도</div>
        <div class="value" id="tProgress">0%</div>
        <div class="sub" id="tProgressSub"></div>
      </div>
      <div class="tile">
        <div class="label">오늘</div>
        <div class="value" id="tDay"></div>
        <div class="sub" id="tDaySub"></div>
      </div>
      <div class="tile">
        <div class="label">계획 대비</div>
        <div class="value" id="tPace"></div>
        <div class="sub" id="tPaceSub"></div>
      </div>
      <div class="tile">
        <div class="label">마지막 기록</div>
        <div class="value" id="tLast"></div>
        <div class="sub" id="tLastSub"></div>
      </div>
    </div>

    <div class="panel" id="todayPanel">
      <h2 id="todayTitle">오늘의 읽기</h2>
      <div class="today-ranges" id="todayRanges"></div>
      <p class="desc">장을 누르면 성경 본문이 열립니다. 다 읽고 <b>"읽음 완료"</b>를 누르면 기록됩니다.</p>
      <div class="chips" id="todayChips"></div>
      <div class="row-actions">
        <button class="btn btn-primary" id="todayAllBtn">📖 오늘 본문 읽기</button>
      </div>
    </div>

    <div class="panel" id="overduePanel" hidden>
      <h2>밀린 읽기</h2>
      <p class="desc">지난 날짜 중 아직 다 읽지 않은 분량입니다. 오래된 것부터 보여드립니다.</p>
      <ul class="overdue" id="overdueList"></ul>
    </div>

    <div class="panel">
      <div class="tabs" id="tabs">
        <button type="button" class="on" data-tab="books">성경별 진도</button>
        <button type="button" data-tab="plan">1년 읽기표</button>
      </div>
      <div id="tab-books"></div>
      <div id="tab-plan" hidden></div>
    </div>
  </div>
</div>

<!-- 한 권의 장 체크 -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="bmTitle"></h2>
        <div class="sub" id="bmSub"></div>
      </div>
      <button class="close-x" data-close aria-label="닫기">×</button>
    </div>
    <div class="chips" id="bmChips"></div>
    <div class="row-actions">
      <button class="btn btn-outline" id="bmAllBtn">이 권 전체 읽음</button>
    </div>
  </div>
</div>

<!-- 성경 본문 읽기 -->
<div class="modal-overlay reader-overlay" id="readerModal">
  <div class="modal reader">
    <div class="rd-top">
      <div>
        <h2 id="rdTitle"></h2>
        <div class="sub" id="rdSub"></div>
      </div>
      <div class="rd-tools">
        <button class="mini-btn" id="rdSmaller" title="글자 작게">가-</button>
        <button class="mini-btn" id="rdBigger" title="글자 크게">가+</button>
        <button class="close-x" data-close-reader aria-label="닫기">×</button>
      </div>
    </div>
    <div class="rd-body" id="rdBody"></div>
    <div class="rd-bottom">
      <button class="mini-btn" id="rdPrevBtn">← 이전 장</button>
      <div class="rd-center">
        <button class="btn btn-primary" id="rdDoneBtn">읽음 완료</button>
        <button class="mini-btn" id="rdUndoBtn" hidden>완료 취소</button>
        <div class="rd-progress" id="rdProgress"></div>
      </div>
      <button class="mini-btn" id="rdNextBtn">다음 장 →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/bible-plan.js"></script>
<script src="js/bible-common.js"></script>
<script src="js/bible-reading.js"></script>
</body>
</html>
