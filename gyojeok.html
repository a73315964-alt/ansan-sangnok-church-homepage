<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교적부 — 안산상록교회</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='0,0 58,0 46,50 58,100 0,100' fill='%2329b6f6'/%3E%3Cpolygon points='100,0 58,0 46,50 58,100 100,100' fill='%238bc34a'/%3E%3Crect x='43' y='12' width='14' height='76' fill='white'/%3E%3Crect x='22' y='43' width='56' height='14' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bible.css">
<link rel="stylesheet" href="css/gyojeok.css">
</head>
<body>

<div class="admin-bar no-print">
  <div class="wrap">
    <div>
      <h1>교적부</h1>
      <div class="who" id="whoLine">확인 중…</div>
    </div>
    <div class="bar-actions">
      <a href="admin.html" class="btn btn-primary">관리자 대시보드</a>
      <a href="bible-admin.html" class="btn btn-outline">성경읽기 관리</a>
      <a href="index.html" class="btn btn-outline">홈으로</a>
      <button class="btn btn-outline" id="logoutBtn">로그아웃</button>
    </div>
  </div>
</div>

<div class="br-wrap no-print">
  <div id="notice"></div>

  <div id="main" hidden>
    <div class="tiles">
      <div class="tile"><div class="label">등록 교인</div><div class="value" id="tTotal">0명</div><div class="sub" id="tGender"></div></div>
      <div class="tile"><div class="label">세례교인</div><div class="value" id="tBaptized">0명</div><div class="sub">신급 세례·입교 또는 세례일 기록</div></div>
      <div class="tile"><div class="label">새가족</div><div class="value" id="tNew">0명</div><div class="sub">최근 3개월 안에 등록</div></div>
      <div class="tile"><div class="label">이번 달 생일</div><div class="value" id="tBirthday">0명</div><div class="sub" id="tBirthdayNames"></div></div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input type="search" id="searchBox" placeholder="이름·전화·주소·가족 검색">
        <select id="fDistrict"><option value="">교구·구역 전체</option></select>
        <select id="fPosition"><option value="">직분 전체</option></select>
        <select id="fOrg"><option value="">봉사기관 전체</option></select>
        <select id="fGender"><option value="">성별 전체</option><option>남</option><option>여</option></select>
        <select id="sortSel">
          <option value="no">번호 순</option>
          <option value="name">이름 순</option>
          <option value="age">나이 많은 순</option>
          <option value="registered">최근 등록 순</option>
        </select>
        <span class="muted" id="countBadge" style="margin-left:auto;"></span>
        <button class="btn btn-outline" id="csvBtn" style="padding:9px 14px;font-size:.84rem;">엑셀(CSV)</button>
        <button class="btn btn-primary" id="addBtn" style="padding:9px 16px;font-size:.86rem;">+ 새 교인 등록</button>
      </div>

      <div class="table-scroll">
        <table class="grid">
          <thead>
            <tr><th>번호</th><th>이름</th><th>생년월일</th><th>직분</th><th>신급</th><th>교구·구역</th><th>봉사기관</th><th>휴대폰</th><th>가족</th><th></th></tr>
          </thead>
          <tbody id="rows"><tr><td colspan="10" class="empty">불러오는 중…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 교인기록카드 보기 (인쇄 가능) -->
<div class="modal-overlay" id="viewOverlay">
  <div class="modal card-modal">
    <div class="modal-head no-print">
      <div class="sub">교인기록카드</div>
      <div style="display:flex;gap:6px;">
        <button class="mini-btn" id="vPrintBtn">인쇄</button>
        <button class="mini-btn primary" id="vEditBtn">수정</button>
        <button class="close-x" data-close aria-label="닫기">×</button>
      </div>
    </div>
    <div id="cardView"></div>
  </div>
</div>

<!-- 등록 / 수정 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal card-modal">
    <div class="modal-head">
      <h2 id="modalTitle">새 교인 등록</h2>
      <button class="close-x" type="button" id="closeFormBtn" aria-label="닫기">×</button>
    </div>
    <form id="memberForm">
      <input type="hidden" id="f_id">

      <div class="form-section">
        <h3>카드 정보</h3>
        <div class="form-grid g4">
          <div class="field"><label for="f_card_no">번호</label><input id="f_card_no"></div>
          <div class="field"><label for="f_written_at">작성일</label><input type="date" id="f_written_at"></div>
          <div class="field"><label for="f_district">교구</label><input id="f_district" list="districtList"></div>
          <div class="field"><label for="f_group_label">구역(속)</label><input id="f_group_label" list="groupList"></div>
        </div>
      </div>

      <div class="form-section">
        <h3>본인</h3>
        <div class="photo-row">
          <div class="photo-box" id="photoBox"><span>사진</span></div>
          <div style="flex:1;min-width:0;">
            <div class="form-grid g3">
              <div class="field"><label for="f_name">이름 (한글) *</label><input id="f_name" required maxlength="30"></div>
              <div class="field"><label for="f_name_hanja">이름 (한문)</label><input id="f_name_hanja" maxlength="30"></div>
              <div class="field"><label for="f_gender">성별</label>
                <select id="f_gender"><option value="">선택</option><option>남</option><option>여</option></select></div>
              <div class="field"><label for="f_birth_date">생년월일</label><input type="date" id="f_birth_date">
                <div class="hint" id="birthHint"></div></div>
              <div class="field"><label for="f_birth_calendar">양력 / 음력</label>
                <select id="f_birth_calendar"><option value="양">양력</option><option value="음">음력</option></select></div>
              <div class="field"><label for="photoInput">사진</label>
                <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp">
                <label class="inline-check" id="photoRemoveWrap" hidden><input type="checkbox" id="photoRemove"> 사진 삭제</label></div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>신앙 · 교회</h3>
        <div class="form-grid g3">
          <div class="field"><label for="f_position">직분</label><select id="f_position"></select></div>
          <div class="field"><label for="f_faith_level">신급</label><select id="f_faith_level"></select></div>
          <div class="field"><label for="f_guide">인도자</label><input id="f_guide"></div>
          <div class="field"><label for="f_baptism_date">세례일</label><input type="date" id="f_baptism_date"></div>
          <div class="field"><label for="f_registered_at">등록일</label><input type="date" id="f_registered_at"></div>
          <div class="field"><label for="f_awards">수상경력</label><input id="f_awards"></div>
          <div class="field full"><label>봉사기관 (여러 개 선택 가능)</label><div class="checks" id="f_orgs"></div></div>
        </div>
      </div>

      <div class="form-section">
        <h3>연락처 · 생활</h3>
        <div class="form-grid g3">
          <div class="field"><label for="f_mobile_phone">휴대폰</label><input id="f_mobile_phone" inputmode="tel" placeholder="010-0000-0000"></div>
          <div class="field"><label for="f_home_phone">전화 (집)</label><input id="f_home_phone" inputmode="tel"></div>
          <div class="field"><label for="f_email">E-mail</label><input type="email" id="f_email"></div>
          <div class="field full"><label for="f_address">주소</label><input id="f_address"></div>
          <div class="field"><label for="f_housing">주거환경</label><select id="f_housing"></select></div>
          <div class="field"><label for="f_hobby">취미</label><input id="f_hobby"></div>
          <div class="field"><label for="f_education">학력</label><input id="f_education"></div>
          <div class="field"><label for="f_workplace">직장</label><input id="f_workplace"></div>
          <div class="field"><label for="f_job_title">직위</label><input id="f_job_title"></div>
          <div class="field"><label for="f_work_phone">직장 전화</label><input id="f_work_phone" inputmode="tel"></div>
        </div>
      </div>

      <div class="form-section">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;">
          <h3 style="margin:0;">가족사항</h3>
          <button type="button" class="mini-btn primary" id="addFamilyBtn">+ 가족 추가</button>
        </div>
        <p class="hint" style="margin:0 0 8px;">우리 교회 교인이면 "교인 연결"에서 고르세요 — 이름·성별·생년월일·직분이 자동으로 채워집니다.</p>
        <div class="family-edit" id="familyEdit"></div>
      </div>

      <div class="form-section">
        <h3>기타</h3>
        <div class="form-grid">
          <div class="field full"><label for="f_family">가족 메모</label><textarea id="f_family"></textarea></div>
          <div class="field full"><label for="f_note">메모</label><textarea id="f_note"></textarea></div>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelBtn">취소</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">저장</button>
      </div>
    </form>
  </div>
</div>

<datalist id="districtList"></datalist>
<datalist id="groupList"></datalist>
<datalist id="religionList"><option>기독교</option><option>천주교</option><option>불교</option><option>무교</option></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/gyojeok.js"></script>
</body>
</html>
